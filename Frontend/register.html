<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | Kabariwala Connect</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="css/style.css" rel="stylesheet"></head><body><nav class="navbar bg-white border-bottom"><div class="container"><a class="navbar-brand brand" href="index.html"><span class="brand-mark">K</span> Kabariwala <span>Connect</span></a><a href="login.html" class="text-link">Already registered? Log in</a></div></nav><main class="page-wrap"><div class="container auth-shell"><section class="auth-card"><a class="brand" href="index.html"><span class="brand-mark">K</span> Kabariwala <span>Connect</span></a><h1 class="h2 fw-bold">Join your local recycling community</h1><p class="auth-intro">A few details help us get you started.</p><form data-demo-form><div class="mb-3"><label class="form-label" for="name">Your full name</label><input id="name" class="form-control" required placeholder="Enter your name"></div><div class="mb-3"><label class="form-label" for="contact">Email or phone number</label><input id="contact" class="form-control" required placeholder="How can we reach you?"></div><div class="mb-3"><label class="form-label" for="new-password">Create a password</label><input id="new-password" type="password" class="form-control" minlength="6" required placeholder="At least 6 characters"></div><div class="mb-3"><label class="form-label" for="confirm-password">Confirm password</label><input id="confirm-password" type="password" class="form-control" minlength="6" required placeholder="Type it again"></div><div class="mb-3"><label class="form-label" for="account-role">Choose your role</label><select id="account-role" class="form-select" required><option value="collector">Collector / Kabadiwala</option><option value="recycler">Recycler</option></select></div><div class="mb-4"><label class="form-label" for="area">Your area or city</label><input id="area" class="form-control" required placeholder="e.g. Jaipur"></div><div class="form-check mb-4"><input class="form-check-input" type="checkbox" id="agree" required><label class="form-check-label" for="agree">I agree to be contacted about my listings and requests.</label></div><button class="btn btn-primary btn-lg rounded-pill w-100">Create my account</button><div class="form-feedback mt-3" aria-live="polite"></div></form></section></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script></body></html>
